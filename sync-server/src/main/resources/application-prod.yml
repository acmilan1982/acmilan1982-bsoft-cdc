server-info:
  serverId: Server001
  version: 1.0
#                                                  # 目标库建表命名策略，已经作废，命名策略由 客户端 决定，每个客户端可以有不同的命名策略
#  tableNamingStrategy: TABLE_MERGE                # TABLE_MERGE：建表时，使用源表名，同名表合并到一个目标表
#                                                  # TABLE_PREFIX: 建表时，使用源表名，同名冲突时加前缀区分
#                                                  # CLIENTID_SCHEMA_TABLE: 建表时，直接使用：探针ID_用户_表名，全局唯一表名，绝对不会冲突

  # 数据同步时，源表删除数据时，目标表的处理策略，
  # 目前只实现了DELETE策略，
  tableRowDeleteStrategy: DELETE             #  DELETE：源表删除数据，目标表也删除数据
                                             #  DELETE_FLAG：源表删除数据，目标表不删除数据，只更新删除标志位。
                                             #  慎用DELETE_FLAG，因为可能存在删数据，再插入相同数据，非常影响性能

  ip: 192.168.1.130            # sync-server所在机器的IP地址
  flinkUiPort: 11005           # flink虚拟集群ui的端口号
  snapshotBatchSize: 500       # 关系型数据库：全量快照每批次处理的记录数，默认500，上限也是500，
                               # 非关系型数据库：全量快照每批次处理的记录数不受此限制，会自动调整
  raw-message-storage-strategy: COMPRESS        # CDC_LOG_CORRECT表中，kafka原始消息的存储策略
                                                # NONE: 不存储原始消息
                                                # PLAIN: 不压缩，直接插入原始文本
                                                # COMPRESS: 压缩后插入（推荐，节省存储空间）

  auto-create-table: true          # 是否自动创建目标表(默认: true)
  auto-expand-column-length: false  # 多表合并时是否自动扩充字段长度（默认true）

server:
  port: 11002
  servlet:
    context-path: /sync-server

config-db:
  driver-class-name: oracle.jdbc.OracleDriver
  url: jdbc:oracle:thin:@172.18.232.239:1521/orcl
  username: CDC
  password: CDC
  maximum-pool-size: 20
  minimum-idle: 16            # 因为有16条线程并发写入日志，建议配置成16
  connection-timeout: 30000
  idle-timeout: 600000


spring:
  application:
    name: KafkaToDB
  main:
    log-startup-info: true
    banner-mode: "console"
  output:
    ansi:
      enabled: NEVER  # cmd 下禁用颜色，避免乱码；Windows Terminal 可改 DETECT/ALWAYS


# === 日志：控制台 + 文件（按天+大小滚动） ===
logging:
  file:
    name: logs/sync-server.log
  level:
    root: INFO
    org.apache.kafka: WARN
    org.apache.kafka.clients: WARN
    org.apache.kafka.clients.consumer: WARN
    org.apache.kafka.clients.producer: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    # 添加ZK监控相关日志级别
    com.bsoft.server.zookeeper: INFO
    com.zaxxer.hikari: DEBUG
    org.apache.flink: DEBUG
  logback:
    rollingpolicy:
      # 保持文件名一致性
      file-name-pattern: logs/sync-server-%d{yyyy-MM-dd}.%i.log
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 10GB
      clean-history-on-start: true
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"



# kafka地址配置
kafka:
  bootstrap:
    servers: 172.18.232.243:9092




#flinke检查点的位置
#windows 下的路径
state-backend:
 checkpoint-path: file:///F:/flink-checkpoints/Server001
 enable-incremental: false

#linux 下的路径
#state-backend:
#  checkpoint-path: file:////root/cdc/server/sync-server-1.0-SNAPSHOT/flink-checkpoints/servers
#  enable-incremental: false


zookeeper:
  connect-string: "172.18.232.173:2181"
  session-timeout-ms: 30000        # 增加到30秒（3.4.14版本建议）
  connection-timeout-ms: 10000     # 连接超时10秒
  base-path: "/bsoft-cdc"
  retry-count: 5                   # 增加重试次数
  retry-interval-ms: 2000          # 增加重试间隔
